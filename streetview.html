<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://maps.googleapis.com https://maps.gstatic.com https://*.google.com https://*.googleapis.com; img-src 'self' data: https: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://maps.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://maps.googleapis.com https://*.googleapis.com https://*.google.com; frame-src https://www.google.com; worker-src blob:;">
  <title>Street View Route Driver</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    #street-view {
      width: 100%;
      height: 100%;
    }

    /* Floating Control Panel */
    #control-panel {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      padding: 20px;
      width: 320px;
      z-index: 1000;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
    }

    #control-panel h1 {
      font-size: 18px;
      margin-bottom: 15px;
      color: #333;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-group {
      margin-bottom: 12px;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
      font-weight: 500;
    }

    .input-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      outline: none;
      border-color: #4285f4;
    }

    .waypoint-group {
      background: #f9f9f9;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .waypoint-group input {
      background: white;
    }

    #waypoints-container:empty {
      display: none;
    }

    .travel-mode {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .travel-mode button {
      flex: 1;
      padding: 10px;
      border: 2px solid #ddd;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 20px;
      transition: all 0.2s;
    }

    .travel-mode button:hover {
      border-color: #4285f4;
    }

    .travel-mode button.active {
      border-color: #4285f4;
      background: #e8f0fe;
    }

    .route-options {
      margin-bottom: 15px;
      padding: 12px;
      background: #f9f9f9;
      border-radius: 6px;
    }

    .option-row {
      margin-bottom: 8px;
    }

    .option-row:last-child {
      margin-bottom: 0;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 13px;
      color: #333;
      user-select: none;
    }

    .checkbox-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #4285f4;
    }

    .checkbox-label:hover {
      color: #4285f4;
    }

    .gpx-drop-zone {
      border: 2px dashed #ddd;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #fafafa;
    }

    .gpx-drop-zone:hover {
      border-color: #4285f4;
      background: #f0f7ff;
    }

    .gpx-drop-zone.drag-over {
      border-color: #4285f4;
      background: #e8f0fe;
      transform: scale(1.02);
    }

    .drop-zone-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #666;
      font-size: 13px;
    }

    #gpx-file-info {
      padding: 8px;
      background: #e6f4ea;
      border-radius: 6px;
    }

    #get-route-btn {
      width: 100%;
      padding: 12px;
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 15px;
      transition: background 0.2s;
    }

    #get-route-btn:hover {
      background: #3367d6;
    }

    #get-route-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .divider {
      height: 1px;
      background: #eee;
      margin: 15px 0;
    }

    #playback-controls {
      display: none;
    }

    #playback-controls.visible {
      display: block;
    }

    .speed-control {
      margin-bottom: 15px;
    }

    .speed-control label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #666;
      margin-bottom: 6px;
    }

    .speed-control input[type="range"] {
      width: 100%;
      cursor: pointer;
    }

    .playback-buttons {
      display: flex;
      gap: 8px;
    }

    .playback-buttons button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    #play-btn {
      background: #34a853;
      color: white;
    }

    #play-btn:hover {
      background: #2d8e47;
    }

    #pause-btn {
      background: #fbbc04;
      color: #333;
    }

    #pause-btn:hover {
      background: #e5a800;
    }

    #stop-btn {
      background: #ea4335;
      color: white;
    }

    #stop-btn:hover {
      background: #d33426;
    }

    .progress-info {
      margin-top: 15px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 6px;
      font-size: 12px;
      color: #666;
    }

    .progress-info .progress-bar {
      height: 4px;
      background: #ddd;
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }

    .progress-info .progress-fill {
      height: 100%;
      background: #4285f4;
      width: 0%;
      transition: width 0.3s;
    }

    #status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
    }

    #status.error {
      background: #fce8e6;
      color: #c5221f;
    }

    #status.success {
      background: #e6f4ea;
      color: #137333;
    }

    #status.info {
      background: #e8f0fe;
      color: #1967d2;
    }

    /* Mini map */
    #mini-map {
      width: 100%;
      height: 200px;
      border-radius: 6px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
    }

    /* Hide panel button + restore button */
    #collapse-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #666;
    }

    #control-panel.hidden {
      display: none;
    }

    #restore-panel-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      color: #333;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      z-index: 1001;
      display: none;
    }

    #restore-panel-btn:hover {
      background: #ffffff;
    }

    /* API Key input */
    #api-key-section {
      margin-bottom: 15px;
      padding: 10px;
      background: #fff3cd;
      border-radius: 6px;
      font-size: 12px;
    }

    #api-key-section input {
      width: 100%;
      padding: 8px;
      margin-top: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
    }

    #api-key-section button {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="street-view"></div>
  
  <!-- Heading indicator for debugging -->
  <div id="heading-indicator" style="position: fixed; top: 10px; right: 20px; background: rgba(0,0,0,0.7); color: white; padding: 8px 12px; border-radius: 6px; font-family: monospace; font-size: 14px; z-index: 999; display: none;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span id="compass-arrow" style="font-size: 20px; display: inline-block; transition: transform 0.3s;">↑</span>
      <span id="heading-value">0°</span>
    </div>
  </div>
  

  <div id="control-panel">
    <button id="collapse-btn">−</button>
    <h1>🚗 Street View Route Driver</h1>

    <div id="api-key-section">
      <div id="api-key-input-area">
        <strong>⚠️ API Key Required</strong>
        <p style="margin-top: 5px;">Enter your Google Maps API key (needs Maps JavaScript API & Directions API enabled)</p>
        <input type="text" id="api-key-input" placeholder="Enter API key...">
        <button id="load-api-btn">Load Google Maps</button>
      </div>
      <div id="api-key-saved-area" style="display: none;">
        <span style="color: #137333;">✓ API Key saved</span>
        <button id="change-api-btn" style="margin-left: 10px; padding: 4px 8px; font-size: 11px; background: #eee; border: 1px solid #ccc; border-radius: 4px; cursor: pointer;">Change</button>
      </div>
    </div>

    <div id="main-controls" style="display: none;">
      <div id="gpx-drop-zone" class="gpx-drop-zone">
        <div class="drop-zone-content">
          <span style="font-size: 24px; margin-bottom: 8px;">📍</span>
          <strong>Drop GPX file here</strong>
          <span style="font-size: 11px; color: #666; margin-top: 4px;">or click to browse</span>
          <input type="file" id="gpx-file-input" accept=".gpx,.kml" style="display: none;">
        </div>
        <div id="gpx-file-info" style="display: none;">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
            <div style="display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0;">
              <span style="font-size: 18px;">✓</span>
              <span id="gpx-filename" style="font-size: 12px; color: #137333; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
            </div>
            <button id="clear-gpx-btn" style="background: none; border: none; color: #ea4335; cursor: pointer; font-size: 18px; padding: 0; line-height: 1;">✕</button>
          </div>
          <div id="gpx-stats" style="font-size: 11px; color: #666; margin-top: 4px;"></div>
        </div>
      </div>

      <div class="divider" style="margin: 12px 0;"></div>

      <div class="input-group">
        <label>Starting Point (A)</label>
        <input type="text" id="origin-input" placeholder="Enter address or click map...">
      </div>

      <div id="waypoints-container"></div>
      
      <button id="add-stop-btn" style="width: 100%; padding: 8px; margin-bottom: 12px; background: #f5f5f5; border: 1px dashed #ccc; border-radius: 6px; cursor: pointer; font-size: 12px; color: #666;">+ Add Stop</button>

      <div class="input-group">
        <label>Destination (B)</label>
        <input type="text" id="destination-input" placeholder="Enter address or click map...">
      </div>

      <div class="travel-mode">
        <button id="mode-drive" class="active" title="Driving">🚗</button>
        <button id="mode-walk" title="Walking">🚶</button>
        <button id="mode-bike" title="Cycling">🚴</button>
      </div>

      <div id="route-options" class="route-options">
        <label style="font-size: 12px; color: #666; margin-bottom: 8px; display: block; font-weight: 500;">Route Options</label>
        <div class="option-row">
          <label class="checkbox-label">
            <input type="checkbox" id="avoid-tolls">
            <span>Avoid tolls</span>
          </label>
        </div>
        <div class="option-row">
          <label class="checkbox-label">
            <input type="checkbox" id="avoid-highways">
            <span>Avoid highways</span>
          </label>
        </div>
        <div class="option-row">
          <label class="checkbox-label">
            <input type="checkbox" id="avoid-ferries">
            <span>Avoid ferries</span>
          </label>
        </div>
      </div>

      <button id="get-route-btn">Get Route</button>

      <div style="position: relative;">
        <div id="mini-map"></div>
        <div id="map-hint" style="display: none; position: absolute; bottom: 5px; left: 5px; background: rgba(0,0,0,0.7); color: white; padding: 4px 8px; border-radius: 4px; font-size: 11px; pointer-events: none;">Shift+Click to jump to point</div>
      </div>

      <div id="playback-controls">
        <div class="divider"></div>
        
        <div class="speed-control">
          <label>
            <span>Speed</span>
            <span id="speed-value">Medium</span>
          </label>
          <input type="range" id="speed-slider" min="1" max="5" value="3">
        </div>

        <div class="playback-buttons">
          <button id="play-btn">▶ Play</button>
          <button id="pause-btn">⏸ Pause</button>
          <button id="stop-btn">⏹ Stop</button>
        </div>

        <div class="progress-info">
          <span id="progress-text">Ready to drive</span>
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <div style="margin-top: 8px;">
            <input type="range" id="position-slider" min="0" max="100" value="0" style="width: 100%; cursor: pointer;" title="Drag to jump to position">
          </div>
        </div>
      </div>

      <div id="status"></div>
    </div>
  </div>

  <button id="restore-panel-btn" title="Show menu">☰</button>

  <script src="app.js"></script>
</body>
</html>
